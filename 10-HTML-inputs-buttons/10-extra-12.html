<!doctype html>
<html>

<head>
    <!-- Main subject: 01 -->

    <title>Value Example</title>
    <link rel="stylesheet" href="10-extra-09.css" />
</head>

<body>
    <h1>Registration Form</h1>
    <form>
        <p>Please fill your details:</p>
        <label id="name-label" for="name-input">Your Name:</label>
        <input type="text" id="name-input" placeholder="write your full name" required />
        <br />
        <label for="age-input">Your age:</label>
        <input type="number" id="age-input" value="30" />
        <br />
        <label for="birth-date-input">Birth Date:</label>
        <input type="date" id="birth-date-input" value="" />
        <br />
        <label for="color-input">Your favorite Color:</label>
        <select id="color-input" name="color-input">
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="purple">Purple</option>
        </select>

        <br />
        <br />
        <p>Recieve updates vai:</p>
        <input type="checkbox" id="email-method" name="update-method" />
        <label for="email-method">Email</label><br />
        <input type="checkbox" id="sms-method" name="update-method" />
        <label for="sms-method">SMS messages</label>
        <input type="checkbox" id="both-method" name="update-method" />
        <label for="both-method">Email and SMS messages</label>
        <br />
        <br />
        <input type="checkbox" id="remember-yes" />
        <label for="remember-yes">Remember account on this computer</label>
        <br />

        <input type="submit" id="blue-button" value="Create account" />
    </form>
</body>

</html>
